<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#262630"/>
      <stop offset="60%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>

    <!-- Sun Radiant Gradient -->
    <radialGradient id="sunGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <!-- Sun Glow Filter -->
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cloud Volumetric 3D Gradient -->
    <linearGradient id="cloudGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cloud Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" ry="28.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Sun Rays -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="20" x2="64" y2="14"/>
    <line x1="84" y1="28" x2="89" y2="23"/>
    <line x1="44" y1="28" x2="39" y2="23"/>
    <line x1="92" y1="48" x2="98" y2="48"/>
    <line x1="36" y1="48" x2="30" y2="48"/>
  </g>

  <!-- Glowing Sun Body -->
  <circle cx="64" cy="48" r="21" fill="url(#sunGrad)" filter="url(#sunGlow)"/>

  <!-- 3D Overlapping Cloud -->
  <path d="M 44 88 
           A 14 14 0 0 1 41 60.5
           A 22 22 0 0 1 78 51
           A 18 18 0 0 1 97 70
           A 14 14 0 0 1 90 88 
           Z" 
        fill="url(#cloudGrad)" 
        filter="url(#dropShadow)"/>

  <!-- Cloud Bottom Highlights -->
  <path d="M 44 88 L 90 88 A 14 14 0 0 0 97 70 C 95 78 88 85 78 86 L 44 88 Z" fill="#94a3b8" opacity="0.3"/>
</svg>
