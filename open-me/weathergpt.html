         bar and the PWA splash; leaving them stale makes the browser chrome
         the one thing on screen not following the theme. -->
    <meta name="theme-color" content="#f4f6f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080e10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="WeatherGPT — conversational weather intelligence and early warning for India." />
    <title>WeatherGPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

         the 84px hero figure; JetBrains Mono carries only the uppercase labels
         and the figures that line up in a column, which is the one job a

      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"

  <body>
    <script>
      // Two things, both before first paint.
      try {
        // 1. The saved theme, so there is no flash of the wrong one.
        var t = localStorage.getItem('wg-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
      // 2. Mark that scripting is on. Every entrance animation is gated behind
      //    `.js`, so if this never runs the content is simply *there* rather
      //    than parked at opacity 0 waiting for an observer that will not come.
      document.documentElement.classList.add('js');
    </script>
    <div id="root"></div>
  </body>
